<script>
const DAY = 86400000;
const now = Date.now();

const CONFIG = {
  communityName: 'Greenfield',
  communitySize: 148,
  votingMethod: 'ranked-choice',
  pruningThreshold: 5,
  pruningPeriod: 7,
  votingPeriod: 7,
  minBallotSize: 2,
  maxBallotSize: 6,
  t0Threshold: 0.72,
  t1Confidence: 0.10,
  t2Minimum: 0.20,
};

let viewerId = null;
try { viewerId = localStorage.getItem('acequia-vid'); } catch(e) {}
if (!viewerId) {
  viewerId = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { localStorage.setItem('acequia-vid', viewerId); } catch(e) {}
}

function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function genVotes(optIds, count, favorIdx, seed) {
  const votes = {};
  for (let i = 0; i < count; i++) {
    let s = seed + i * 7919;
    const ranked = seededShuffle(optIds, s);
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    if ((s % 100) < 42 && favorIdx !== undefined) {
      const fi = ranked.indexOf(optIds[favorIdx]);
      if (fi > 0) { ranked.splice(fi, 1); ranked.unshift(optIds[favorIdx]); }
    }
    votes['s' + i] = ranked;
  }
  return votes;
}

const proposals = [
  {
    id: 'p1', status: 'pruning', origin: 'community',
    title: 'Community garden tool lending',
    description: 'Should the community garden establish a formal tool lending program, or continue with the current informal sharing arrangement?',
    proposer: 'Garden Committee',
    type: 'ranked-choice',
    created: now - 3 * DAY,
    pruningDeadline: now + 4 * DAY,
    votingDeadline: null,
    options: [
      { id: 'p1o1', label: 'Free lending with sign-out sheet', description: 'Volunteer-maintained, tools stored in the garden shed', submitter: 'Garden Committee', upvotes: ['a','b','c','d','e','f','g','h','i','j','k','l','m','n','o','p','q','r','s','t','u','v','w','x'] },
      { id: 'p1o2', label: 'Weekly tool library hours', description: 'Saturday mornings, staffed by volunteers', submitter: 'Resident', upvotes: ['a','b','c','d','e','f','g','h','i','j','k','l','m','n','o','p','q','r'] },
      { id: 'p1o3', label: 'No formal program needed', description: 'Current informal sharing works fine', submitter: 'Resident', upvotes: ['a','b','c','d','e','f','g','h','i','j','k','l'] },
      { id: 'p1o4', label: 'Deposit-based lending', description: 'Small refundable deposit per tool, any time', submitter: 'Resident', upvotes: ['a','b','c','d','e','f','g'] },
      { id: 'p1o5', label: 'Tool rental fees', description: 'Fund maintenance through modest rental charges', submitter: 'Resident', upvotes: ['a','b','c'] },
    ],
    votes: {}, result: null,
  },
  {
    id: 'p8', status: 'pruning', origin: 'community',
    title: 'Farmers market vendor parking',
    description: 'Saturday morning vendors are parking on residential streets and blocking driveways. Should we designate vendor-only parking behind the community center, or leave it informal?',
    proposer: 'Resident',
    type: 'ranked-choice',
    created: now - 2 * DAY,
    pruningDeadline: now + 5 * DAY,
    votingDeadline: null,
    options: [
      { id: 'p8o1', label: 'Designate vendor lot behind community center', description: 'Mark 20 spaces for vendor use Saturdays 5am-2pm', submitter: 'Resident', upvotes: ['a','b','c','d','e','f','g','h','i','j','k','l','m','n','o','p','q','r','s'] },
      { id: 'p8o2', label: 'Shared lot with early vendor window', description: 'Vendors get priority 5-7am, then first-come after', submitter: 'Resident', upvotes: ['a','b','c','d','e','f','g','h','i','j'] },
      { id: 'p8o3', label: 'Keep it informal', description: 'No change, neighbors work it out', submitter: 'Resident', upvotes: ['a','b','c','d','e'] },
    ],
    votes: {}, result: null,
  },
  {
    id: 'p2', status: 'voting', origin: 'council',
    title: 'Main Street light post color',
    description: 'What color should we paint the light posts along Main Street between Oak and Elm? The posts are due for repainting this fall.',
    proposer: 'Parks Director Chen',
    type: 'ranked-choice',
    created: now - 12 * DAY,
    pruningDeadline: now - 5 * DAY,
    votingDeadline: now + 2 * DAY,
    options: [
      { id: 'p2o1', label: 'Forest green', description: 'Classic park green, matches existing benches', submitter: 'Parks Director Chen', upvotes: new Array(47).fill(0).map((_,i)=>'u'+i) },
      { id: 'p2o2', label: 'Black', description: 'Modern, low-maintenance', submitter: 'Resident', upvotes: new Array(31).fill(0).map((_,i)=>'u'+i) },
      { id: 'p2o3', label: 'Navy blue', description: 'Matches the downtown banner colors', submitter: 'Resident', upvotes: new Array(22).fill(0).map((_,i)=>'u'+i) },
      { id: 'p2o4', label: 'Leave as-is', description: 'Current gray finish, no repainting needed', submitter: 'Resident', upvotes: new Array(18).fill(0).map((_,i)=>'u'+i) },
    ],
    prunedOptions: [

function timeLeft(deadline) {
  if (!deadline) return '';
  const diff = deadline - Date.now();
  if (diff <= 0) return 'Closed';
  const d = Math.floor(diff / DAY);
  const h = Math.floor((diff % DAY) / 3600000);
  if (d > 0) return d + 'd ' + h + 'h left';
  return h + 'h left';
}

function optById(p, id) {
  return p.options.find(o => o.id === id) || (p.prunedOptions || []).find(o => o.id === id);
}

function tierLabel(t) {
  return { T0: 'Acclamation', T1: 'Clear', T2: 'Close', T3: 'Inconclusive' }[t] || t;
}
function tierExplain(t) {
  return {
    T0: 'The community spoke with one voice.',
    T1: 'Clear winner by ranked choice elimination.',
    T2: 'Advisory to Council. Community leaned but did not reach clear signal.',
    T3: 'No clear signal. Council decides with full community input on the record.',
  }[t] || '';
}

function runRCV(opts, allVotes) {
  const optIds = opts.map(o => o.id);
  let remaining = [...optIds];
  const ballots = Object.values(allVotes).map(r => [...r]);
  const rounds = [];
  while (remaining.length > 1) {
    const counts = {};
    remaining.forEach(id => counts[id] = 0);
    ballots.forEach(b => {
      const pick = b.find(id => remaining.includes(id));
      if (pick) counts[pick]++;
    });
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    if (total === 0) break;
    if (sorted[0][1] > total / 2) {
      rounds.push({ counts: {...counts}, eliminated: null });
      break;
    }
    const elim = sorted[sorted.length - 1][0];
    rounds.push({ counts: {...counts}, eliminated: elim });
    remaining = remaining.filter(id => id !== elim);
  }
  if (rounds.length === 0 || (rounds[rounds.length-1].eliminated !== null && remaining.length === 1)) {
    const counts = {};
    remaining.forEach(id => counts[id] = 0);
    ballots.forEach(b => {
      const pick = b.find(id => remaining.includes(id));
      if (pick) counts[pick]++;
    });
    rounds.push({ counts, eliminated: null });
  }
  const fc = rounds[rounds.length-1].counts;
  const total = Object.values(fc).reduce((a,b)=>a+b,0);
  const winner = Object.entries(fc).sort((a,b)=>b[1]-a[1])[0]?.[0];
  return { winner, rounds, totalVotes: total };
}

function computeTier(rcv, communitySize) {
  const participation = rcv.totalVotes / communitySize;
  if (participation < CONFIG.t2Minimum) return 'T3';
  const fc = rcv.rounds[rcv.rounds.length-1].counts;
  const total = rcv.totalVotes;
  const wv = fc[rcv.winner] || 0;
  if (wv / total >= CONFIG.t0Threshold) return 'T0';
  const sorted = Object.values(fc).sort((a,b)=>b-a);
  const margin = (sorted[0] - (sorted[1]||0)) / total;
  if (margin >= CONFIG.t1Confidence) return 'T1';
  return 'T2';
}

  if (view === 'detail') return renderDetail();

function renderActiveList() {
  const active = proposals.filter(p => p.status === 'pruning' || p.status === 'voting');
  const official = active.filter(p => p.origin === 'council');
  const petitions = active.filter(p => p.origin === 'community');
  let html = '';
  if (official.length) {
    html += `<div class="origin-header"><span class="origin-dot official"></span>Official Decisions</div>`;
    const oPruning = official.filter(p => p.status === 'pruning');
    const oVoting = official.filter(p => p.status === 'voting');
    if (oPruning.length) { html += `<div class="phase-label">Pruning</div>`; oPruning.forEach(p => html += renderCard(p)); }
    if (oVoting.length) { html += `<div class="phase-label"${oPruning.length?' style="margin-top:20px"':''}>Voting</div>`; oVoting.forEach(p => html += renderCard(p)); }
  }
  if (petitions.length) {
    html += `<div class="origin-header"${official.length?' style="margin-top:28px"':''}><span class="origin-dot petition"></span>Community Petitions</div>`;
    const cPruning = petitions.filter(p => p.status === 'pruning');
    const cVoting = petitions.filter(p => p.status === 'voting');
    if (cPruning.length) { html += `<div class="phase-label">Pruning</div>`; cPruning.forEach(p => html += renderCard(p)); }
    if (cVoting.length) { html += `<div class="phase-label"${cPruning.length?' style="margin-top:20px"':''}>Voting</div>`; cVoting.forEach(p => html += renderCard(p)); }
  }
  if (!active.length) {
    html += `<div class="empty">No active proposals. Start one.</div>`;
  }
  return html;
}

function renderDecidedList() {
  const decided = proposals.filter(p => p.status === 'decided');
  if (!decided.length) return `<div class="empty">No decisions yet.</div>`;
  const official = decided.filter(p => p.origin === 'council');
  const petitions = decided.filter(p => p.origin === 'community');
  let html = '';
  if (official.length) {
    html += `<div class="origin-header"><span class="origin-dot official"></span>Official Decisions</div>`;
    official.forEach(p => html += renderCard(p));
  }
  if (petitions.length) {
    html += `<div class="origin-header"${official.length?' style="margin-top:28px"':''}><span class="origin-dot petition"></span>Community Petitions</div>`;
    petitions.forEach(p => html += renderCard(p));
  }
  return html;
}

function renderCard(p) {
  const badge = p.status === 'pruning' ? `<span class="badge badge-pruning">Pruning</span>`
    : p.status === 'voting' ? `<span class="badge badge-voting">Voting</span>`
    : p.result ? `<span class="badge badge-${p.result.tier.toLowerCase()}">${p.result.tier} &middot; ${tierLabel(p.result.tier)}</span>` : '';

  const opts = p.options.length;
  const deadline = p.status === 'pruning' ? p.pruningDeadline : p.votingDeadline;
  const voteCount = Object.keys(p.votes).length;

  let meta = `<span>${opts} option${opts!==1?'s':''}</span>`;
  if (p.status === 'voting') meta += `<span>${voteCount} vote${voteCount!==1?'s':''}</span>`;
  if (p.status === 'decided' && p.result) {
    const w = optById(p, p.result.winner);
    meta += `<span>Winner: ${w ? w.label : '?'}</span>`;
  }
  if (deadline && p.status !== 'decided') meta += `<span>${timeLeft(deadline)}</span>`;
  meta += `<span>by ${p.proposer}</span>`;

  return `<div class="card" data-action="open" data-id="${p.id}">
    <div class="card-top">${badge}<div class="card-title">${p.title}</div></div>
    <div class="card-desc">${p.description}</div>
    <div class="card-meta">${meta}</div>
  </div>`;
}

function renderDetail() {
  const p = proposals.find(x => x.id === selectedId);
  if (!p) return '';

  const badge = p.status === 'pruning' ? `<span class="badge badge-pruning">Pruning</span>`
    : p.status === 'voting' ? `<span class="badge badge-voting">Voting</span>`
    : p.result ? `<span class="badge badge-${p.result.tier.toLowerCase()}">${p.result.tier} &middot; ${tierLabel(p.result.tier)}</span>` : '';

  const deadline = p.status === 'pruning' ? p.pruningDeadline : p.votingDeadline;

  const originBadge = p.origin === 'council'
    ? `<span class="badge badge-official">Official</span>`
    : `<span class="badge badge-petition">Petition</span>`;

  let html = `<button class="back-btn" data-action="back">&larr; All proposals</button>
    <div class="detail-hdr">
      <div class="detail-title">${p.title}</div>
      <div class="detail-meta">${originBadge}${badge}
        <span>${p.type}</span>
        <span>by ${p.proposer}</span>
        ${deadline && p.status !== 'decided' ? `<span>${timeLeft(deadline)}</span>` : ''}
      </div>
      <div class="detail-desc">${p.description}</div>
    </div>`;

  if (p.status === 'pruning') html += renderPruning(p);
  else if (p.status === 'voting') html += renderVoting(p);
  else if (p.status === 'decided') html += renderDecided(p);

  html += renderDemoControls(p);
  return html;
}

  const sorted = [...p.options].sort((a,b) => b.upvotes.length - a.upvotes.length);
  sorted.forEach(o => {
    const voted = o.upvotes.includes(viewerId);

function renderVoting(p) {

  if (myVote && !ranking.length) {
    const voteCount = Object.keys(p.votes).length;
    return `<div class="voted-msg">Vote submitted. Your ranking is recorded.</div>

  const ballotIds = p.options.map(o => o.id);

  const unranked = ballotIds.filter(id => !rankedIds.includes(id));

  let html = `<div class="vote-ui">
    <div class="section-label">Your ranking</div>`;

  if (rankedIds.length === 0) {
    html += `<div class="rank-empty">Click options below to rank them in order of preference</div>`;
  } else {
    html += `<div class="rank-list">`;
    rankedIds.forEach((id, i) => {
      const o = optById(p, id);
      html += `<div class="rank-item">
        <span class="rank-num">${i+1}.</span>
        <span class="rank-label">${o ? o.label : id}</span>
        <div class="rank-btns">
          ${i > 0 ? `<button class="rank-btn" data-action="rank-up" data-idx="${i}" title="Move up">&uarr;</button>` : ''}
          ${i < rankedIds.length-1 ? `<button class="rank-btn" data-action="rank-down" data-idx="${i}" title="Move down">&darr;</button>` : ''}
          <button class="rank-btn" data-action="rank-remove" data-idx="${i}" title="Remove">&times;</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  if (unranked.length) {
    html += `<div class="section-label" style="margin-top:16px">Options</div>
      <div class="chip-grid">`;
    unranked.forEach(id => {
      const o = optById(p, id);
      html += `<button class="chip" data-action="rank-add" data-oid="${id}">${o ? o.label : id}</button>`;
    });
    html += `</div>`;
  }

  const allRanked = unranked.length === 0 && rankedIds.length > 0;
  const voteCount = Object.keys(p.votes).length;

  html += `<div class="vote-footer">
    <button class="btn btn-primary" data-action="submit-vote" data-pid="${p.id}" ${allRanked?'':'disabled'}>Submit vote</button>
    <div class="vote-status">${voteCount} of ~${CONFIG.communitySize} voted</div>
  </div>`;

  if ((p.prunedOptions || []).length) {
    html += `<div class="section-label" style="margin-top:24px">Pruned (below threshold)</div><div class="opt-list">`;

    });
    html += `</div>`;

  html += `</div>`;
  return html;
}

function renderDecided(p) {
  const r = p.result;
  if (!r) return '';
  const w = optById(p, r.winner);
  const finalCounts = r.rounds[r.rounds.length - 1].counts;
  const total = r.totalVotes;

  let html = `<div class="tier-box ${r.tier.toLowerCase()}">
    <div class="tier-code">${r.tier} &middot; ${tierLabel(r.tier)}</div>
    <div class="tier-winner">${w ? w.label : '?'}</div>
    <div class="tier-explain">${tierExplain(r.tier)}</div>
  </div>`;

  const sorted = Object.entries(finalCounts).sort((a,b) => b[1] - a[1]);
  html += `<div class="section-label">Final distribution (${total} votes)</div><div class="bar-list">`;
  sorted.forEach(([id, count]) => {
    const o = optById(p, id);
    const pct = Math.round(count / total * 100);
    const isWinner = id === r.winner;
    html += `<div class="bar-row ${isWinner?'winner':''}">
      <span class="bar-label">${o ? o.label : id}</span>
      <div class="bar-track"><div class="bar-fill" data-w="${pct}%"></div></div>
      <span class="bar-pct">${pct}%</span>
    </div>`;
  });
  html += `</div>`;

  if (r.rounds.length > 1) {
    const rid = 'rounds-' + p.id;
    const show = showRounds[p.id];
    html += `<button class="rounds-toggle" data-action="toggle-rounds" data-pid="${p.id}">${show ? 'Hide' : 'Show'} elimination rounds</button>`;
    if (show) {
      html += `<div class="rounds-detail">`;
      r.rounds.forEach((rd, i) => {
        const entries = Object.entries(rd.counts).sort((a,b)=>b[1]-a[1]);
        const rdTotal = Object.values(rd.counts).reduce((a,b)=>a+b,0);
        html += `<div style="margin:6px 0"><strong>Round ${i+1}:</strong> `;
        html += entries.map(([id, c]) => {
          const o = optById(p, id);
          return `${o?o.label:id} ${c} (${Math.round(c/rdTotal*100)}%)`;
        }).join(' / ');
        if (rd.eliminated) {
          const eo = optById(p, rd.eliminated);
          html += ` &mdash; <em>${eo?eo.label:rd.eliminated} eliminated</em>`;
        }
        html += `</div>`;
      });
      html += `</div>`;
    }
  }

  if (r.councilAction) {
    const icon = r.councilAction === 'honored' ? '&#10003;' : '&#9888;';
    html += `<div class="council-action">
      <span class="ca-icon">${icon}</span>
      <div class="ca-text"><strong>Council ${r.councilAction}</strong>${r.councilNote ? ' &mdash; ' + r.councilNote : ''}</div>
    </div>`;
  }

  return html;
}

function renderDemoControls(p) {
  let btn = '';
  if (p.status === 'pruning') {
    btn = `<button class="btn btn-ghost" data-action="advance" data-pid="${p.id}">Advance to Voting &rarr;</button>`;
  } else if (p.status === 'voting') {
    btn = `<button class="btn btn-ghost" data-action="close-voting" data-pid="${p.id}">Close Voting &rarr;</button>`;
  }
  if (!btn) return '';
  return `<div class="demo-bar"><div class="demo-label">Demo Controls</div>${btn}</div>`;
}

function renderNewForm() {
  return `<div class="form-wrap view">
    <button class="back-btn" data-action="back">&larr; Back</button>
    <div class="detail-title" style="margin-bottom:4px">New Community Petition</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:20px">Anyone can start a petition. It enters pruning, then goes to a community vote. Official decisions are created by the Town Council.</div>
    <div class="form-group">
      <label class="form-label">Title</label>
      <input class="form-input" id="np-title" placeholder="What is being decided?" maxlength="120">
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-input" id="np-desc" placeholder="Context, constraints, why this matters..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Voting method</label>
      <select class="form-input" id="np-type">
        <option value="ranked-choice">Ranked choice</option>
        <option value="poll">Simple poll</option>
        <option value="approval">Approval voting</option>
      </select>
    </div>
    <button class="btn btn-primary" data-action="create-proposal">Create Proposal</button>
  </div>`;
}

document.getElementById('app').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === 'tab') {
    const t = btn.dataset.tab;
    if (t === 'new') { view = 'new'; }
    else { view = 'list'; tab = t; }
    selectedId = null; ranking = [];
    render();
  }
  else if (action === 'open') {
    selectedId = btn.dataset.id;
    view = 'detail'; ranking = [];
    render();
  }
  else if (action === 'back') {
    view = 'list'; selectedId = null; ranking = [];
    render();
  }
  else if (action === 'upvote') {
    const p = proposals.find(x => x.id === btn.dataset.pid);
    const o = p && p.options.find(x => x.id === btn.dataset.oid);
    if (!o) return;
    const idx = o.upvotes.indexOf(viewerId);
    if (idx >= 0) o.upvotes.splice(idx, 1);
    else o.upvotes.push(viewerId);
    render();
    const el = document.querySelector(`[data-oid="${btn.dataset.oid}"] .upvote-count`);
    if (el) el.classList.add('upvote-pop');
  }
  else if (action === 'add-option') {
    const input = document.getElementById('new-opt-input');
    const val = input && input.value.trim();
    if (!val) return;
    const p = proposals.find(x => x.id === btn.dataset.pid);
    if (!p) return;
    p.options.push({
      id: 'o' + Date.now(),
      label: val,
      description: '',
      submitter: 'You',
      upvotes: [viewerId],
    });
    render();
  }
  else if (action === 'rank-add') {
    ranking.push(btn.dataset.oid);
    render();
  }
  else if (action === 'rank-remove') {
    ranking.splice(parseInt(btn.dataset.idx), 1);
    render();
  }
  else if (action === 'rank-up') {
    const i = parseInt(btn.dataset.idx);
    if (i > 0) { [ranking[i-1], ranking[i]] = [ranking[i], ranking[i-1]]; }
    render();
  }
  else if (action === 'rank-down') {
    const i = parseInt(btn.dataset.idx);
    if (i < ranking.length - 1) { [ranking[i], ranking[i+1]] = [ranking[i+1], ranking[i]]; }
    render();
  }
  else if (action === 'submit-vote') {
    const p = proposals.find(x => x.id === btn.dataset.pid);
    if (!p || !ranking.length) return;
    p.votes[viewerId] = [...ranking];
    hasVoted[p.id] = true;
    saveVotes();
    ranking = [];
    render();
  }
  else if (action === 'change-vote') {
    const p = proposals.find(x => x.id === btn.dataset.pid);
    if (!p) return;
    ranking = p.votes[viewerId] ? [...p.votes[viewerId]] : [];
    delete hasVoted[p.id];
    saveVotes();
    render();
  }
  else if (action === 'advance') {
    const p = proposals.find(x => x.id === btn.dataset.pid);
    if (!p) return;
    const surviving = p.options.filter(o => o.upvotes.length >= CONFIG.pruningThreshold);
    const pruned = p.options.filter(o => o.upvotes.length < CONFIG.pruningThreshold);
    if (surviving.length < CONFIG.minBallotSize) {
      alert('Not enough options above the pruning threshold (' + CONFIG.pruningThreshold + ' upvotes). Need at least ' + CONFIG.minBallotSize + '.');
      return;
    }
    p.prunedOptions = [...(p.prunedOptions || []), ...pruned];
    p.options = surviving;
    p.status = 'voting';
    p.votingDeadline = Date.now() + CONFIG.votingPeriod * DAY;
    render();
  }
  else if (action === 'close-voting') {
    const p = proposals.find(x => x.id === btn.dataset.pid);
    if (!p) return;
    const rcv = runRCV(p.options, p.votes);
    const tier = computeTier(rcv, CONFIG.communitySize);
    p.result = {
      winner: rcv.winner,
      tier: tier,
      rounds: rcv.rounds,
      totalVotes: rcv.totalVotes,
      councilAction: (tier === 'T0' || tier === 'T1') ? 'honored' : null,
      councilNote: (tier === 'T0' || tier === 'T1') ? null
        : tier === 'T2' ? 'Awaiting Council decision. Community lean is on the record.'
        : 'Inconclusive. Council may re-open, decide, or table.',
    };
    p.status = 'decided';
    tab = 'decided';
    render();
  }
  else if (action === 'toggle-rounds') {
    showRounds[btn.dataset.pid] = !showRounds[btn.dataset.pid];
    render();
  }
  else if (action === 'create-proposal') {
    const title = document.getElementById('np-title')?.value.trim();
    const desc = document.getElementById('np-desc')?.value.trim();
    const type = document.getElementById('np-type')?.value || 'ranked-choice';
    if (!title) { alert('Title is required.'); return; }
    proposals.unshift({
      id: 'p' + Date.now(),
      status: 'pruning',
      origin: 'community',
      title, description: desc || '',
      proposer: 'You',
      type,
      created: Date.now(),
      pruningDeadline: Date.now() + CONFIG.pruningPeriod * DAY,
      votingDeadline: null,
      options: [],
      prunedOptions: [],
      votes: {},
      result: null,
    });
    view = 'list'; tab = 'active';
    render();
  }
});

render();
</script>
