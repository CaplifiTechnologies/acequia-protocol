name: Gate Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run gate checks
        run: |
          chmod +x scripts/ci-gate.sh
          ./scripts/ci-gate.sh

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          unsigned=""
          while IFS= read -r line; do
            hash=$(echo "$line" | cut -d' ' -f1)
            msg=$(echo "$line" | cut -d' ' -f2-)
            if ! git log -1 --format='%b' "$hash" | grep -q '^Signed-off-by:'; then
              unsigned="$unsigned\n  $hash $msg"
            fi
          done <<< "$(git log "$base"..HEAD --format='%H %s')"

          if [ -n "$unsigned" ]; then
            echo "::error::Commits missing DCO sign-off:"
            echo -e "$unsigned"
            echo ""
            echo "Add sign-off with: git commit -s --amend"
            exit 1
          fi
          echo "All commits signed off."
